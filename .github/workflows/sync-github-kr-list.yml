name: Sync GitHub KR List

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: github-kr-list-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch repositories in KR List
        run: python3 tools/sync_github_kr_list.py

      - name: Commit changes when the list changes
        shell: bash
        run: |
          if git diff --quiet -- github-kr-list.json; then
            echo "No KR List changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-kr-list.json
          git commit -m "chore: sync GitHub KR List"
          git push
