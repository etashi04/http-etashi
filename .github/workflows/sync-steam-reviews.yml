name: Sync Steam curator reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: steam-curator-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch current Steam curator reviews
        run: python3 tools/sync_steam_reviews.py

      - name: Commit changes when new reviews exist
        shell: bash
        run: |
          if git diff --quiet -- steam-reviews.json steam-reviews.js script.js; then
            echo "No curator changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-reviews.json steam-reviews.js script.js
          git commit -m "chore: sync Steam curator reviews"
          git push
